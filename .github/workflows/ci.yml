name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.24"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --frozen --extra dev
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Unit tests
        run: uv run pytest -m "not integration"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dummy values, only to make `docker compose config` interpolate.
      POSTGRES_PASSWORD: ci
      RABBITMQ_PASSWORD: ci
      MLFLOW_DB_PASSWORD: ci
      GRAFANA_ADMIN_PASSWORD: ci
      LITELLM_MASTER_KEY: sk-ci
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate Compose
        run: |
          docker compose -f deploy/docker-compose.yml config -q
          docker compose -f deploy/docker-compose.yml --profile ml --profile obs config -q
      - name: Build app image
        run: docker build -f deploy/Dockerfile -t ragqa-app:ci .

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      rabbitmq:
        # Same version as deploy/docker-compose.yml, without the management plugin.
        image: rabbitmq:4.3.6
        env:
          RABBITMQ_DEFAULT_USER: ci
          RABBITMQ_DEFAULT_PASS: ci
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          # The registry tests reset the schema and refuse a database without "test" in its name.
          POSTGRES_DB: ragqa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ragqa_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        # Same version as deploy/docker-compose.yml. The image has no curl, so no health check;
        # the tests start after uv sync, which takes longer than Qdrant's startup.
        image: qdrant/qdrant:v1.19.2
        ports:
          - 6333:6333
    env:
      RAGQA_TEST_RABBITMQ_URL: amqp://ci:ci@localhost:5672/
      RAGQA_TEST_POSTGRES_DSN: postgresql+asyncpg://ci:ci@localhost:5432/ragqa_test
      RAGQA_TEST_QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.24"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --frozen --extra dev
      - name: Integration tests
        # The tests skip when a service URL is unset, and a skip exits 0. Fail on any skip.
        shell: bash
        run: |
          uv run pytest -m integration -q -rs | tee pytest.log
          ! grep -qi "skipped" pytest.log
