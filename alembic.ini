# For creating revisions locally, for example:
#   RAGQA_POSTGRES_DSN=postgresql+asyncpg://... uv run alembic revision --autogenerate -m "..."
# The database URL comes from RAGQA_POSTGRES_DSN (see env.py). Containers run
# `python -m ragqa.storage.postgres.migrate` and do not use this file.
[alembic]
script_location = src/ragqa/storage/postgres/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
