global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Targets of services in inactive profiles show as down; that is expected.
scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  - job_name: worker
    static_configs:
      - targets: ["worker:9100"]

  - job_name: qdrant
    static_configs:
      - targets: ["qdrant:6333"]

  - job_name: rabbitmq
    # rabbitmq_prometheus plugin port.
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: tei
    # TEI 1.9.4 serves /metrics on its HTTP port (checked against the running container).
    static_configs:
      - targets: ["tei:80"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Not scraped:
  # - MLflow: --expose-prometheus uses a Gunicorn-only exporter, while MLflow 3 serves
  #   with uvicorn. Not verified, so left out.
  # - LiteLLM: the docs disagree on whether the prometheus callback is Enterprise-only.
  #   LLM calls are measured in the API instead (ragqa_llm_*).
