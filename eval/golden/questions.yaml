- id: fol-04
  category: follow_up
  split: dev
  question: Which of those effects also affects the Pods that are already running there?
  history:
  - role: user
    content: How can I keep Pods away from a particular node?
  - role: assistant
    content: Taint the node. A taint has an effect, either NoSchedule, PreferNoSchedule or NoExecute,
      and only Pods with a matching toleration are allowed to stay or to be scheduled there.
  evidence:
  - document: concepts/scheduling-eviction/taint-and-toleration.md
    version: release-1.36
    quote: 'NoExecute : This affects pods that are already running on the node as follows: - Pods that
      do not tolerate the taint are evicted immediately - Pods that tolerate the taint without specifying
      tolerationSeconds in their toleration specification remain bound forever - Pods that tolerate the
      taint with a specified tolerationSeconds remain bound for the specified amount of time. After that
      time elapses, the node lifecycle controller evicts the Pods from the node.'
  reference_answer: NoExecute. Pods that do not tolerate the taint are evicted immediately, Pods that
    tolerate it without tolerationSeconds remain bound forever, and Pods that tolerate it with tolerationSeconds
    remain bound for that amount of time and are then evicted.
- id: fol-05
  category: follow_up
  split: dev
  question: What does the last one do?
  history:
  - role: user
    content: Which types of Service are there?
  - role: assistant
    content: The types are ClusterIP, NodePort, LoadBalancer and ExternalName.
  evidence:
  - document: concepts/services-networking/service.md
    version: release-1.36
    quote: 'ExternalName : Maps the Service to the contents of the externalName field (for example, to
      the hostname api.foo.bar.example). The mapping configures your cluster''s DNS server to return a
      CNAME record with that external hostname value. No proxying of any kind is set up.'
  reference_answer: ExternalName maps the Service to the contents of the externalName field, for example
    a hostname. The mapping configures the cluster's DNS server to return a CNAME record with that external
    hostname value, and no proxying of any kind is set up.
- id: fol-06
  category: follow_up
  split: test
  question: How do I make it run on only some of the nodes?
  history:
  - role: user
    content: What is a DaemonSet?
  - role: assistant
    content: A DaemonSet makes sure that a copy of a Pod runs on the nodes of a cluster, for example a
      logging agent that must run on every node.
  evidence:
  - document: concepts/workloads/controllers/daemonset.md
    version: release-1.36
    quote: If you specify a .spec.template.spec.nodeSelector, then the DaemonSet controller will create
      Pods on nodes which match that node selector. Likewise if you specify a .spec.template.spec.affinity,
      then DaemonSet controller will create Pods on nodes which match that node affinity.
  reference_answer: Specify a .spec.template.spec.nodeSelector, so the DaemonSet controller creates Pods
    only on nodes that match it, or a .spec.template.spec.affinity for a node affinity. Without either,
    it creates Pods on all nodes.
