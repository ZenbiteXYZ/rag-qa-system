- id: fol-01
  category: follow_up
  split: test
  question: Can its Pods be launched all at once instead of one by one?
  history:
  - role: user
    content: What is a StatefulSet?
  - role: assistant
    content: A StatefulSet manages a set of Pods and gives each of them a stable identity. By default
      it creates and deletes its Pods one at a time, in order.
  evidence:
  - document: concepts/workloads/controllers/statefulset.md
    version: release-1.36
    quote: Parallel pod management tells the StatefulSet controller to launch or terminate all Pods in
      parallel, and to not wait for Pods to become Running and Ready or completely terminated prior to
      launching or terminating another Pod.
  reference_answer: Yes. Parallel pod management tells the StatefulSet controller to launch or terminate
    all Pods in parallel, without waiting for Pods to become Running and Ready or completely terminated
    before launching or terminating another Pod.
