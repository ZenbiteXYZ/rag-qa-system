- id: met-02
  category: metadata_cue
  split: test
  question: According to the documentation written by S. Lebedev, which path types does an Ingress support,
    and what does each match?
  expected_filters:
    author: S. Lebedev
  evidence:
  - document: concepts/services-networking/ingress.md
    version: release-1.36
    quote: 'There are three supported path types: - ImplementationSpecific: With this path type, matching
      is up to the IngressClass. Implementations can treat this as a separate pathType or treat it identically
      to Prefix or Exact path types. - Exact: Matches the URL path exactly and with case sensitivity.
      - Prefix: Matches based on a URL path prefix split by /. Matching is case sensitive and done on
      a path element by element basis. A path element refers to the list of labels in the path split by
      the / separator. A request is a match for path p if every p is an element-wise prefix of p of the
      request path.'
  reference_answer: 'Three: ImplementationSpecific (matching is up to the IngressClass), Exact (matches
    the URL path exactly and with case sensitivity) and Prefix (matches based on a URL path prefix split
    by /, case sensitive and element by element).'
