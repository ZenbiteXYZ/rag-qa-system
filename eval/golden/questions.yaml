# DRAFT for the author to review (ADR-0005). 42 questions, 6 per category, 3 dev and 3 test per category.
# Quotes were cut from the parser output of the corpus, split drawn with seed 20261014.
# Authors in expected_filters are the synthetic ones of eval/corpus/authors.json (ADR-0007).
- id: sec-01
  category: single_section
  split: test
  question: How many old ReplicaSets does a Deployment keep by default?
  evidence:
  - document: concepts/workloads/controllers/deployment.md
    version: release-1.36
    quote: You can set .spec.revisionHistoryLimit field in a Deployment to specify how many old ReplicaSets
      for this Deployment you want to retain. The rest will be garbage-collected in the background. By
      default, it is 10.
  reference_answer: 10. The default of .spec.revisionHistoryLimit is 10, and the rest are garbage-collected
    in the background.
- id: sec-02
  category: single_section
  split: dev
  question: What is the maximum amount of data that a ConfigMap can hold?
  evidence:
  - document: concepts/configuration/configmap.md
    version: release-1.36
    quote: The data stored in a ConfigMap cannot exceed 1 MiB.
  reference_answer: 1 MiB.
- id: sec-03
  category: single_section
  split: test
  question: Why can the name of a CronJob not be longer than 52 characters?
  evidence:
  - document: concepts/workloads/controllers/cron-jobs.md
    version: release-1.36
    quote: Even when the name is a DNS subdomain, the name must be no longer than 52 characters. This
      is because the CronJob controller will automatically append 11 characters to the name you provide
      and there is a constraint that the length of a Job name is no more than 63 characters.
  reference_answer: The CronJob controller appends 11 characters to the name, and the name of a Job can
    be at most 63 characters long.
- id: sec-04
  category: single_section
  split: test
  question: Which PersistentVolume reclaim policy is deprecated, and what is recommended instead?
  evidence:
  - document: concepts/storage/persistent-volumes.md
    version: release-1.36
    quote: 'Warning: The Recycle reclaim policy is deprecated. Instead, the recommended approach is to
      use dynamic provisioning.'
  reference_answer: The Recycle reclaim policy is deprecated. The recommended approach is dynamic provisioning.
- id: sec-05
  category: single_section
  split: dev
  question: What does the PreferNoSchedule taint effect do?
  evidence:
  - document: concepts/scheduling-eviction/taint-and-toleration.md
    version: release-1.36
    quote: 'PreferNoSchedule : PreferNoSchedule is a "preference" or "soft" version of NoSchedule. The
      control plane will try to avoid placing a Pod that does not tolerate the taint on the node, but
      it is not guaranteed.'
  reference_answer: 'It is a soft version of NoSchedule: the control plane tries to avoid placing a Pod
    that does not tolerate the taint on the node, but this is not guaranteed.'
- id: sec-06
  category: single_section
  split: dev
  question: By default, how many retries does a Job allow before it is considered failed, and how does
    the delay between retries grow?
  evidence:
  - document: concepts/workloads/controllers/job.md
    version: release-1.36
    quote: The .spec.backoffLimit is set by default to 6, unless the backoff limit per index (only Indexed
      Job) is specified. When .spec.backoffLimitPerIndex is specified, then .spec.backoffLimit defaults
      to 2147483647 (MaxInt32). Failed Pods associated with the Job are recreated by the Job controller
      with an exponential back-off delay (10s, 20s, 40s ...) capped at six minutes.
  reference_answer: Six retries (.spec.backoffLimit defaults to 6). Failed Pods are recreated with an
    exponential back-off delay of 10s, 20s, 40s and so on, capped at six minutes.
- id: mul-01
  category: multi_section
  split: test
  question: How do the NodePort and LoadBalancer Service types expose a Service outside the cluster?
  evidence:
  - document: concepts/services-networking/service.md
    version: release-1.36
    quote: 'NodePort : Exposes the Service on each Node''s IP at a static port (the NodePort). To make
      the node port available, Kubernetes sets up a cluster IP address, the same as if you had requested
      a Service of type: ClusterIP.'
  - document: concepts/services-networking/service.md
    version: release-1.36
    quote: 'LoadBalancer : Exposes the Service externally using an external load balancer. Kubernetes
      does not directly offer a load balancing component; you must provide one, or you can integrate your
      Kubernetes cluster with a cloud provider.'
  reference_answer: NodePort exposes the Service on each Node's IP at a static port (and also sets up
    a cluster IP). LoadBalancer exposes it through an external load balancer, which you must provide yourself
    or get by integrating with a cloud provider.
- id: mul-02
  category: multi_section
  split: test
  question: What is the difference between the Retain and Delete reclaim policies of a PersistentVolume?
  evidence:
  - document: concepts/storage/persistent-volumes.md
    version: release-1.36
    quote: The Retain reclaim policy allows for manual reclamation of the resource. When the PersistentVolumeClaim
      is deleted, the PersistentVolume still exists and the volume is considered "released". But it is
      not yet available for another claim
  - document: concepts/storage/persistent-volumes.md
    version: release-1.36
    quote: For volume plugins that support the Delete reclaim policy, deletion removes both the PersistentVolume
      object from Kubernetes, as well as the associated storage asset in the external infrastructure.
  reference_answer: With Retain, the PersistentVolume still exists after its claim is deleted and is considered
    released, for manual reclamation. With Delete, the PersistentVolume object and the associated storage
    asset in the external infrastructure are removed.
- id: mul-03
  category: multi_section
  split: dev
  question: What is the difference between a ResourceQuota and a LimitRange?
  evidence:
  - document: concepts/policy/resource-quotas.md
    version: release-1.36
    quote: A resource quota, defined by a ResourceQuota object, provides constraints that limit aggregate
      resource consumption per namespace.
  - document: concepts/policy/limit-range.md
    version: release-1.36
    quote: A LimitRange is a policy to constrain the resource allocations (limits and requests) that you
      can specify for each applicable object kind (such as Pod or PersistentVolumeClaim) in a namespace.
  reference_answer: A ResourceQuota limits the aggregate resource consumption per namespace (and can limit
    the number of objects by kind). A LimitRange constrains the resource allocations (limits and requests)
    of each individual object of an applicable kind in a namespace.
- id: mul-04
  category: multi_section
  split: test
  question: How are CPU limits and memory limits enforced differently for a container?
  evidence:
  - document: concepts/configuration/manage-resources-containers.md
    version: release-1.36
    quote: cpu limits are enforced by CPU throttling. When a container approaches its cpu limit, the kernel
      will restrict access to the CPU corresponding to the container's limit. Thus, a cpu limit is a hard
      limit the kernel enforces. Containers may not use more CPU than is specified in their cpu limit.
  - document: concepts/configuration/manage-resources-containers.md
    version: release-1.36
    quote: memory limits are enforced by the kernel with out of memory (OOM) kills. When a container uses
      more than its memory limit, the kernel may terminate it.
  reference_answer: 'CPU limits are enforced by CPU throttling: the container cannot use more CPU than
    its limit. Memory limits are enforced by the kernel with out of memory (OOM) kills: a container that
    uses more than its memory limit may be terminated, but only once the kernel detects memory pressure.'
- id: mul-05
  category: multi_section
  split: dev
  question: When I drain a node, how do PodDisruptionBudgets affect the eviction of Pods?
  evidence:
  - document: tasks/administer-cluster/safely-drain-node.md
    version: release-1.36
    quote: You can use kubectl drain to safely evict all of your pods from a node before you perform maintenance
      on the node (e.g. kernel upgrade, hardware maintenance, etc.). Safe evictions allow the pod's containers
      to gracefully terminate and will respect the PodDisruptionBudgets
  - document: concepts/workloads/pods/disruptions.md
    version: release-1.36
    quote: A PDB limits the number of Pods of a replicated application that are down simultaneously from
      voluntary disruptions.
  reference_answer: kubectl drain evicts Pods safely and respects the PodDisruptionBudgets you have defined.
    A PodDisruptionBudget limits the number of Pods of a replicated application that are down at the same
    time from voluntary disruptions, so a drain only evicts as many Pods as the budget allows.
- id: mul-06
  category: multi_section
  split: dev
  question: What is the difference between voluntary and involuntary disruptions of Pods?
  evidence:
  - document: concepts/workloads/pods/disruptions.md
    version: release-1.36
    quote: 'We call these unavoidable cases involuntary disruptions to an application. Examples are: -
      a hardware failure of the physical machine backing the node'
  - document: concepts/workloads/pods/disruptions.md
    version: release-1.36
    quote: We call other cases voluntary disruptions. These include both actions initiated by the application
      owner and those initiated by a Cluster Administrator.
  reference_answer: Involuntary disruptions are unavoidable cases, for example a hardware failure of the
    physical machine backing the node. Voluntary disruptions are the other cases, and include both actions
    initiated by the application owner and those initiated by a cluster administrator.
