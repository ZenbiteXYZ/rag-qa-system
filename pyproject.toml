[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragqa"
version = "0.1.0"
description = "RAG QA service with document versioning and pluggable retrieval techniques"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143",
    "uvicorn>=0.54",
    "python-multipart>=0.0.32",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "aio-pika>=10.1",
    "qdrant-client>=1.19",
    "httpx>=0.28",
    "openai>=3.33",
    "mlflow-tracing>=3.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
    "mypy>=2.4",
    "pre-commit>=4.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ragqa"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["ragqa"]
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs running services (Compose)"]
